name: Build blog index and upload assets

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 2  # Important: fetch at least 2 commits for git diff HEAD~1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml vercel_blob python-dotenv

    - name: Run build.py (generates build.json)
      run: python build.py

    - name: Run upload to Vercel Blob (only changed files)
      run: python upload_to_vercel.py

    - name: Commit and push updated build.json and manifest.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        git add build.json manifest.json
        git diff --cached --quiet || git commit -m "auto-build: update build.json and manifest.json"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
